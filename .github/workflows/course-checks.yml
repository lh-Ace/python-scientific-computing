name: Course smoke checks

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Python syntax
        run: python -m compileall -q lessons tests
      - name: Run standard-library checks
        run: python -m unittest discover -s tests -v
